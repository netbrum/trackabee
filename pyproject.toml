[project]
name = "trackabee"
version = "0.1.0"
description = "Progress tracker bot"
authors = [{ name = "netbrum", email = "netbrum@tutanota.com" }]
requires-python = ">=3.14"
dependencies = [
  "aiosqlite>=0.22.1",
  "discord-py>=2.7.1",
  "kaleido>=1.5.1",
  "pandas>=3.1.1",
  "plotly>=7.1.0",
  "pydantic-settings>=2.16.3",
  "python-dateutil>=4.0.0",
  "sqlalchemy[asyncio]>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
